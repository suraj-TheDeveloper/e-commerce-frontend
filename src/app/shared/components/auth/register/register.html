<div class="register-container">
  <div class="register-card">
    <h2>Create Account</h2>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <!-- NAME -->
      <div class="form-group">
        <input type="text" placeholder="Full Name" formControlName="name">
        <div class="error" *ngIf="submitted && f['name'].errors">
          <small *ngIf="f['name'].errors['required']">Name is required</small>
          <small *ngIf="f['name'].errors['minlength']">Minimum 3 characters</small>
        </div>
      </div>

      <!-- EMAIL -->
      <div class="form-group">
        <input type="email" placeholder="Email" formControlName="email">
        <div class="error" *ngIf="submitted && f['email'].errors">
          <small *ngIf="f['email'].errors['required']">Email is required</small>
          <small *ngIf="f['email'].errors['email']">Invalid email</small>
        </div>
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <input type="password" placeholder="Password" formControlName="password">
        <div class="error" *ngIf="submitted && f['password'].errors">
          <small *ngIf="f['password'].errors['required']">Password is required</small>
          <small *ngIf="f['password'].errors['minlength']">Min 6 characters</small>
        </div>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div class="form-group">
        <input type="password" placeholder="Confirm Password" formControlName="confirmPassword">
        <div class="error" *ngIf="submitted && f['confirmPassword'].errors">
          <small *ngIf="f['confirmPassword'].errors['required']">Confirm your password</small>
          <small *ngIf="f['confirmPassword'].errors['mismatch']">Passwords do not match</small>
        </div>
      </div>

      <button class="btn-primary" [disabled]="loading">
        {{ loading ? 'Registering...' : 'Register' }}
      </button>

    </form>
  </div>
</div>
